name: CI (Continuous Integration)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Install GUI Test Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: terminal/package-lock.json

      - name: Install the terminal runtime
        run: npm ci --prefix terminal --ignore-scripts --omit=optional

      - name: Build with Maven
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cipherquest-build
          path: |
            target/*.jar
            terminal/*.mjs
            terminal/package*.json
          retention-days: 7
