description=ห้องนิรภัยมีสิ่งของหลายประเภทและหลายระดับพลัง\nสำรวจผังห้องและตรากำกับรอบสถานีสุดท้ายเพื่อระบุสิ่งของที่ต้องค้น
task=ใช้รหัสห้องและประเภทจากหลักฐานรอบสถานี ค้นหาสิ่งของที่มีพลังสูงสุดในกลุ่มนั้น (artifact_name, artifact_type, location_name, power_level, clue)
schema=CREATE TABLE artifacts (\n  artifact_id TEXT PRIMARY KEY,\n  artifact_name TEXT NOT NULL,\n  artifact_type TEXT NOT NULL,\n  power_level INTEGER NOT NULL,\n  location_id TEXT NOT NULL,\n  clue TEXT NULL\n);\nCREATE TABLE locations (\n  location_id TEXT PRIMARY KEY,\n  location_name TEXT NOT NULL,\n  description TEXT NULL\n);
expected_query=SELECT a.artifact_name, a.artifact_type, l.location_name, a.power_level, a.clue\nFROM artifacts a\nJOIN locations l ON a.location_id = l.location_id\nWHERE a.location_id = 'L005'\n  AND a.artifact_type = 'Treasure'\n  AND a.power_level = (\n    SELECT MAX(power_level)\n    FROM artifacts\n    WHERE location_id = 'L005'\n      AND artifact_type = 'Treasure'\n  )
main_clue_id=MC05
ending_message=Main Story Completed — The True Lost Treasure: Memory Archive recovered! The Lost Treasure is not gold or physical wealth, but the complete memories, history, and accumulated knowledge of the ancient civilization.
answer_hash=correct_if_returns_memory_archive
hints.1=ระดับ 1 (แนวคิด): ใช้ JOIN เชื่อมตารางสถานที่ ร่วมกับ Subquery และ MAX() ใน WHERE เพื่อหาชิ้นที่มีค่าพลังสูงสุด
hints.2=ระดับ 2 (โครงสร้าง): SELECT ... FROM table1 a JOIN table2 l ON a.loc_id = l.loc_id WHERE a.loc_id = '...' AND a.type = '...' AND a.power = (SELECT MAX(power) FROM table1 WHERE ...);
hints.3=ระดับ 3 (เจาะจง): เชื่อม artifacts a JOIN locations l ON a.location_id = l.location_id กรอง location_id = 'L005' AND artifact_type = 'Treasure' และให้ power_level = (SELECT MAX(power_level) FROM artifacts WHERE location_id = 'L005' AND artifact_type = 'Treasure')
required_tables.1=artifacts
required_tables.2=locations
