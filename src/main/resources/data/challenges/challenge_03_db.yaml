id: 3
mission_code: "M01"
type: database
title: "M01 — นักสำรวจที่หายตัวไป"
difficulty: "ง่าย"
sql_concepts:
  - SELECT
  - FROM
  - WHERE
description: |
  คุณเปิดใช้งานเทอร์มินัลเทคโนโลยีโบราณและเข้าสู่คลังข้อมูลได้สำเร็จ
  ข้อมูลชุดแรกที่พบคือรายชื่อนักสำรวจที่เคยเข้ามาสำรวจพื้นที่นี้
  ลองตามหาข้อมูลล่าสุดของนักสำรวจที่ชื่อ Arin เพื่อดูเบาะแสแรกกัน

task: "ค้นหาข้อมูลของนักสำรวจชื่อ Arin (explorer_id, explorer_name, status, clue)"
schema: |
  CREATE TABLE explorers (
    explorer_id TEXT PRIMARY KEY,
    explorer_name TEXT NOT NULL,
    status TEXT NOT NULL,
    clue TEXT NULL
  );
expected_query: "SELECT explorer_id, explorer_name, status, clue FROM explorers WHERE explorer_name = 'Arin'"
main_clue_id: "MC01"
answer_hash: "correct_if_returns_arin_record"

hints:
  - "ระดับ 1 (แนวคิด): ใช้ SELECT เลือกคอลัมน์ที่ต้องการ จากตารางด้วย FROM และกรองแถวด้วย WHERE เมื่อข้อความตรงกันพอดี"
  - "ระดับ 2 (โครงสร้าง): SELECT col1, col2, col3, col4 FROM table_name WHERE column_name = 'value';"
  - "ระดับ 3 (เจาะจง): เลือก explorer_id, explorer_name, status, clue จากตาราง explorers โดยใส่เงื่อนไข WHERE explorer_name = 'Arin'"
