description=คุณเดินเข้าสู่ห้องลับตามเบาะแสที่ได้มา ภายในห้องมีโบราณวัตถุบันทึกอยู่หลายชิ้น\nแต่มีเพียงชิ้นที่มีระดับพลังอยู่ในช่วงสำคัญเท่านั้นที่น่าตรวจสอบ
task=ค้นหาโบราณวัตถุในห้องจากเบาะแสเดิม ที่มีพลัง 50-100 สูงสุด 5 อันดับแรก (artifact_id, artifact_name, artifact_type, power_level, clue)
schema=CREATE TABLE artifacts (\n  artifact_id TEXT PRIMARY KEY,\n  artifact_name TEXT NOT NULL,\n  artifact_type TEXT NOT NULL,\n  power_level INTEGER NOT NULL,\n  location_id TEXT NOT NULL,\n  clue TEXT NULL\n);
expected_query=SELECT artifact_id, artifact_name, artifact_type, power_level, clue FROM artifacts WHERE location_id = 'L002' AND power_level BETWEEN 50 AND 100 ORDER BY power_level DESC LIMIT 5
main_clue_id=MC03
answer_hash=correct_if_returns_relic_chamber_artifacts
hints.1=ระดับ 1 (แนวคิด): ใช้ BETWEEN เพื่อกรองช่วงตัวเลข ใช้ ORDER BY ... DESC เรียงจากมากไปน้อย และใช้ LIMIT จำกัดจำนวนแถว
hints.2=ระดับ 2 (โครงสร้าง): SELECT ... FROM table_name WHERE loc_col = '...' AND num_col BETWEEN min AND max ORDER BY num_col DESC LIMIT n;
hints.3=ระดับ 3 (เจาะจง): เลือก artifact_id, artifact_name, artifact_type, power_level, clue จาก artifacts โดยกรอง location_id = 'L002' และ power_level BETWEEN 50 AND 100 เรียงด้วย ORDER BY power_level DESC แล้ว LIMIT 5
required_tables.1=artifacts
