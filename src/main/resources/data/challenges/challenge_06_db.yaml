type: database
title: "M04 — บันทึกที่ถูกซ่อน"
difficulty: "ปานกลาง–ยาก"
sql_concepts:
  - SELECT
  - JOIN
  - ON
  - WHERE
description: |
  คุณพบว่าแกนพลัง Prime Core เคยถูกนำไปใช้ในการทดลองลับ
  ลองดึงบันทึกการทดลองที่เชื่อมโยงกับโบราณวัตถุชิ้นนี้ออกมาดู

task: "ค้นหาข้อมูลการทดลองของ Prime Core โดยเชื่อมข้อมูลจาก 2 ตาราง (artifact_name, experiment_type, result, clue)"
schema: |
  CREATE TABLE artifacts (
    artifact_id TEXT PRIMARY KEY,
    artifact_name TEXT NOT NULL,
    artifact_type TEXT NOT NULL,
    power_level INTEGER NOT NULL,
    location_id TEXT NOT NULL,
    clue TEXT NULL
  );
  CREATE TABLE experiments (
    experiment_id INTEGER PRIMARY KEY,
    experiment_type TEXT NOT NULL,
    artifact_id TEXT NOT NULL,
    result TEXT NULL,
    clue TEXT NULL
  );
expected_query: "SELECT a.artifact_name, e.experiment_type, e.result, e.clue FROM artifacts a JOIN experiments e ON a.artifact_id = e.artifact_id WHERE a.artifact_id = 'A003'"
main_clue_id: "MC04"
answer_hash: "correct_if_returns_prime_core_experiment"

hints:
  - "ระดับ 1 (แนวคิด): ใช้ JOIN ... ON เพื่อเชื่อมแถวจาก 2 ตารางเข้าด้วยกันผ่านคอลัมน์รหัสที่ตรงกัน"
  - "ระดับ 2 (โครงสร้าง): SELECT a.col1, e.col2, e.col3, e.col4 FROM table1 a JOIN table2 e ON a.id = e.id WHERE a.id = 'value';"
  - "ระดับ 3 (เจาะจง): เชื่อม artifacts a JOIN experiments e ON a.artifact_id = e.artifact_id แล้วกรอง WHERE a.artifact_id = 'A003' เพื่อเลือก artifact_name, experiment_type, result, clue"
