id: 6
mission_code: "M04"
type: database
title: "M04 — The Hidden Records"
difficulty: "Intermediate–Advanced"
sql_concepts:
  - SELECT
  - JOIN
  - ON
  - WHERE
description: |
  The player discovers that the Prime Core was involved in a classified experiment.
  Uncover the hidden experiment records linked to it.

task: "Retrieve the experiment associated with the Prime Core (artifact_name, experiment_type, result, clue)."
schema: |
  CREATE TABLE artifacts (
    artifact_id TEXT PRIMARY KEY,
    artifact_name TEXT NOT NULL,
    artifact_type TEXT NOT NULL,
    power_level INTEGER NOT NULL,
    location_id TEXT NOT NULL,
    clue TEXT NULL
  );
  CREATE TABLE experiments (
    experiment_id INTEGER PRIMARY KEY,
    experiment_type TEXT NOT NULL,
    artifact_id TEXT NOT NULL,
    result TEXT NULL,
    clue TEXT NULL
  );
expected_query: "SELECT a.artifact_name, e.experiment_type, e.result, e.clue FROM artifacts a JOIN experiments e ON a.artifact_id = e.artifact_id WHERE a.artifact_id = 'A003'"
main_clue_id: "MC04"
answer_hash: "correct_if_returns_prime_core_experiment"

hints:
  - "Level 1 (Concept): Use JOIN ... ON to combine rows from two related tables based on a shared foreign key column."
  - "Level 2 (Structure): SELECT a.col1, e.col2, e.col3, e.col4 FROM table1 a JOIN table2 e ON a.id = e.id WHERE a.id = 'value';"
  - "Level 3 (Specific): Join artifacts a and experiments e ON a.artifact_id = e.artifact_id WHERE a.artifact_id = 'A003', selecting artifact_name, experiment_type, result, clue."
