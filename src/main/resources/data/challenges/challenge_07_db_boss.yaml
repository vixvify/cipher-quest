id: 7
mission_code: "M05"
type: database
title: "M05 — สมบัติที่สาบสูญ"
difficulty: "ท้าทาย"
sql_concepts:
  - SELECT
  - JOIN
  - ON
  - WHERE
  - AND
  - Subquery
  - MAX
description: |
  ในที่สุดคุณก็มาถึงห้องนิรภัยที่เบาะแสการทดลองก่อนหน้าชี้ไว้
  ภารกิจสุดท้ายคือตามหา Treasure ที่ทรงพลังที่สุดที่ซ่อนอยู่ข้างใน

task: "ค้นหา Treasure ที่พลังสูงสุดในห้องนิรภัยจากเบาะแสเดิม (artifact_name, artifact_type, location_name, power_level, clue)"
schema: |
  CREATE TABLE artifacts (
    artifact_id TEXT PRIMARY KEY,
    artifact_name TEXT NOT NULL,
    artifact_type TEXT NOT NULL,
    power_level INTEGER NOT NULL,
    location_id TEXT NOT NULL,
    clue TEXT NULL
  );
  CREATE TABLE locations (
    location_id TEXT PRIMARY KEY,
    location_name TEXT NOT NULL,
    description TEXT NULL
  );
expected_query: |
  SELECT a.artifact_name, a.artifact_type, l.location_name, a.power_level, a.clue
  FROM artifacts a
  JOIN locations l ON a.location_id = l.location_id
  WHERE a.location_id = 'L005'
    AND a.artifact_type = 'Treasure'
    AND a.power_level = (
      SELECT MAX(power_level)
      FROM artifacts
      WHERE location_id = 'L005'
        AND artifact_type = 'Treasure'
    )
main_clue_id: "MC05"
answer_hash: "correct_if_returns_memory_archive"

hints:
  - "ระดับ 1 (แนวคิด): ใช้ JOIN เชื่อมตารางสถานที่ ร่วมกับ Subquery และ MAX() ใน WHERE เพื่อหาชิ้นที่มีค่าพลังสูงสุด"
  - "ระดับ 2 (โครงสร้าง): SELECT ... FROM table1 a JOIN table2 l ON a.loc_id = l.loc_id WHERE a.loc_id = '...' AND a.type = '...' AND a.power = (SELECT MAX(power) FROM table1 WHERE ...);"
  - "ระดับ 3 (เจาะจง): เชื่อม artifacts a JOIN locations l ON a.location_id = l.location_id กรอง location_id = 'L005' AND artifact_type = 'Treasure' และให้ power_level = (SELECT MAX(power_level) FROM artifacts WHERE location_id = 'L005' AND artifact_type = 'Treasure')"
