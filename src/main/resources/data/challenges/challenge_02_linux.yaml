id: 2
type: linux
title: "Terminal Access"
description: |
  คุณเข้าถึง shell ได้แล้ว ไฟล์โปรแกรมที่ใช้เจาะระบบถูกซ่อนอยู่ในระบบ
  ค้นหาโปรแกรมให้พบแล้วรันขึ้นมาเพื่อผ่านด่าน

task: "ค้นหาโปรแกรมเจาะระบบแล้วรันขึ้นมา (Execute)"
target_binary: "/opt/security/breach.bin"

hint: "ลองสำรวจโฟลเดอร์ /opt หรือใช้คำสั่ง find / -name '*.bin' เพื่อค้นหาโปรแกรมแล้วรันด้วย ./"
