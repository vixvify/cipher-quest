type=linux
title=Terminal Access
description=เชื่อมต่อ Linux Terminal สำเร็จแล้ว\n\nภารกิจ: ค้นหาไฟล์โปรแกรมที่ซ่อนอยู่ในเครื่อง (นามสกุล .bin) แล้วสั่งรันโปรแกรมนั้นขึ้นมาเพื่อผ่านด่าน
task=ค้นหาไฟล์โปรแกรม .bin ที่ซ่อนอยู่ แล้วสั่งรันโปรแกรม (Execute)
target_binary=/opt/security/breach.bin
hint=ใช้คำสั่ง find / -name '*.bin' หรืออ่านไฟล์ ~/readme.txt และ /var/log/syslog เพื่อหาตำแหน่งไฟล์ จากนั้น cd เข้าโฟลเดอร์แล้วรันด้วย ./ชื่อไฟล์
