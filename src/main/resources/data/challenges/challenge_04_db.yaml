id: 4
mission_code: "M02"
type: database
title: "M02 — ข้อความสุดท้าย"
difficulty: "ง่าย–ปานกลาง"
sql_concepts:
  - SELECT
  - WHERE
  - AND
  - LIKE
description: |
  คุณเปิดดูบันทึกการเดินทางของ Arin ได้แล้ว
  บันทึกส่วนใหญ่เป็นข้อมูลทั่วไป แต่มีข้อความหนึ่งที่พูดถึงสัญลักษณ์ลึกลับ

task: "ค้นหาบันทึกของ Arin ที่มีคำว่า 'สัญลักษณ์ (symbol)' (log_id, explorer_id, message, clue)"
schema: |
  CREATE TABLE expedition_logs (
    log_id INTEGER PRIMARY KEY,
    explorer_id TEXT NOT NULL,
    location_id TEXT NOT NULL,
    message TEXT NOT NULL,
    clue TEXT NULL
  );
expected_query: "SELECT log_id, explorer_id, message, clue FROM expedition_logs WHERE explorer_id = 'E001' AND message LIKE '%symbol%'"
main_clue_id: "MC02"
answer_hash: "correct_if_returns_arin_symbol_log"

hints:
  - "ระดับ 1 (แนวคิด): ใช้ WHERE ... AND ... เพื่อกรอง 2 เงื่อนไขพร้อมกัน และใช้ LIKE กับ '%' เพื่อค้นหาคำบางส่วนในข้อความ"
  - "ระดับ 2 (โครงสร้าง): SELECT col1, col2, col3, col4 FROM table_name WHERE id_col = 'ID' AND text_col LIKE '%keyword%';"
  - "ระดับ 3 (เจาะจง): เลือก log_id, explorer_id, message, clue จากตาราง expedition_logs โดยกำหนด explorer_id = 'E001' และ message LIKE '%symbol%'"
