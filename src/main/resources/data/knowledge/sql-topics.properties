topic.1.id=KC01
topic.1.category=พื้นฐานการดึงข้อมูล
topic.1.title=SELECT & FROM — เลือกคอลัมน์และตาราง
topic.1.concepts=SELECT,FROM
topic.1.overview=SELECT กับ FROM คือจุดเริ่มต้นของทุกคำสั่ง SQL ใช้บอกระบบว่าต้องการอ่านคอลัมน์ไหน และอ่านมาจากตารางชื่ออะไร
topic.1.syntax=SELECT column1, column2\nFROM table_name;
topic.1.explanation=- SELECT ใช้ระบุชื่อคอลัมน์ที่ต้องการดู คั่นแต่ละคอลัมน์ด้วยลูกน้ำ , (หรือใช้ * ถ้าอยากดูทุกคอลัมน์)\n- FROM ใช้บอกชื่อตารางที่เก็บข้อมูลนั้นอยู่\n- เครื่องหมาย ; ท้ายประโยคช่วยปิดจบคำสั่งให้ชัดเจน
topic.1.example=SELECT title, genre, pages\nFROM books;
topic.1.expected_result=title               | genre    | pages\n--------------------+----------+------\nSQL Basics          | Database | 180\nStarlight Tales     | Fiction  | 320\nData Modeling Guide | Database | 260\nOcean Atlas         | Science  | 410\nQuery Patterns      | Database | 210
topic.1.mistakes=- ลืมใส่ลูกน้ำ , คั่นระหว่างชื่อคอลัมน์หลัง SELECT\n- สะกดชื่อตารางหรือชื่อคอลัมน์ผิดแม้แต่ตัวเดียว\n- ใช้ SELECT * ทั้งที่โจทย์ต้องการดูแค่บางคอลัมน์

topic.2.id=KC02
topic.2.category=การกรองข้อมูล
topic.2.title=WHERE — กรองแถวตามเงื่อนไข
topic.2.concepts=WHERE
topic.2.overview=WHERE ใช้คัดกรองข้อมูลในตาราง ให้แสดงเฉพาะแถวที่ตรงกับเงื่อนไขที่เรากำหนด ไม่ต้องดึงออกมาทั้งหมด
topic.2.syntax=SELECT column1, column2\nFROM table_name\nWHERE column_name = 'value';
topic.2.explanation=- เขียน WHERE ต่อท้าย FROM เสมอ\n- ถ้าค่าที่เทียบเป็นข้อความ ให้ครอบด้วยเครื่องหมาย '...' เช่น 'Database'\n- ถ้าเป็นตัวเลข ไม่ต้องใส่เครื่องหมายคำพูด เช่น pages > 200
topic.2.example=SELECT title, pages\nFROM books\nWHERE genre = 'Database';
topic.2.expected_result=title               | pages\n--------------------+------\nSQL Basics          | 180\nData Modeling Guide | 260\nQuery Patterns      | 210
topic.2.mistakes=- เอา WHERE ไปวางไว้ก่อน FROM\n- ลืมใส่เครื่องหมาย '...' รอบข้อความ\n- พิมพ์ตัวพิมพ์เล็ก-ใหญ่ใน '...' ไม่ตรงกับข้อมูลจริงในตาราง (SQLite แยกตัวเล็ก-ใหญ่)

topic.3.id=KC03
topic.3.category=การกรองข้อมูล
topic.3.title=AND — รวมหลายเงื่อนไขพร้อมกัน
topic.3.concepts=AND
topic.3.overview=AND ใช้เชื่อมเงื่อนไขตั้งแต่ 2 ข้อขึ้นไปใน WHERE โดยผลลัพธ์ที่ได้ต้องผ่านครบทุกเงื่อนไขพร้อมกัน
topic.3.syntax=SELECT column1, column2\nFROM table_name\nWHERE condition1 AND condition2;
topic.3.explanation=- เขียนเงื่อนไขแรกหลัง WHERE แล้วคั่นด้วย AND ตามด้วยเงื่อนไขถัดไป\n- ทั้งสองฝั่งของ AND ต้องเป็นเงื่อนไขที่สมบูรณ์ เช่น genre = 'Database' AND publish_year >= 2023
topic.3.example=SELECT title, publish_year\nFROM books\nWHERE genre = 'Database' AND publish_year >= 2023;
topic.3.expected_result=title               | publish_year\n--------------------+-------------\nData Modeling Guide | 2023\nQuery Patterns      | 2024
topic.3.mistakes=- เขียนคำว่า WHERE ซ้ำอีกรอบแทนที่จะใช้ AND\n- ลืมใส่ชื่อคอลัมน์หลัง AND เช่น publish_year = 2023 AND 2024

topic.4.id=KC04
topic.4.category=การค้นหาข้อความบางส่วน
topic.4.title=LIKE & % — ค้นหาคำบางส่วน
topic.4.concepts=LIKE,Wildcards (%),Wildcards,%
topic.4.overview=LIKE ใช้ค้นหาข้อความเมื่อเรารู้แค่คำบางส่วนข้างใน ไม่ได้รู้ข้อความทั้งประโยคแบบเป๊ะๆ
topic.4.syntax=SELECT column1, column2\nFROM table_name\nWHERE text_column LIKE '%keyword%';
topic.4.explanation=- ใช้ LIKE แทนเครื่องหมาย = เมื่อต้องการเทียบแบบบางส่วน\n- % แทนตัวอักษรอะไรก็ได้กี่ตัวก็ได้ (หรือไม่มีเลยก็ได้)\n- '%Data%' หาคำว่า Data ที่อยู่ตรงไหนก็ได้, 'Data%' หาคำที่ขึ้นต้นด้วย Data, '%Guide' หาคำที่ลงท้ายด้วย Guide
topic.4.example=SELECT title, genre\nFROM books\nWHERE title LIKE '%Data%';
topic.4.expected_result=title               | genre\n--------------------+---------\nData Modeling Guide | Database
topic.4.mistakes=- ใช้เครื่องหมาย = '%word%' แทน LIKE '%word%' (แบบนั้นจะไปหาข้อความที่มีตัว % จริงๆ)\n- ลืมใส่ % ทำให้ LIKE กลายเป็นเทียบตรงตัวเหมือน =

topic.5.id=KC05
topic.5.category=การกรองช่วงตัวเลข
topic.5.title=BETWEEN — กรองข้อมูลเป็นช่วง
topic.5.concepts=BETWEEN
topic.5.overview=BETWEEN ใช้เช็กว่าค่าอยู่ในช่วงตั้งแต่ค่าน้อยสุดถึงค่ามากสุดหรือไม่ โดยนับรวมทั้งค่าหัวและค่าท้ายด้วย
topic.5.syntax=SELECT column1, column2\nFROM table_name\nWHERE number_column BETWEEN min_value AND max_value;
topic.5.explanation=- BETWEEN มีความหมายเหมือน >= min_value AND <= max_value แต่เขียนสั้นกว่า\n- ต้องวางค่าน้อยไว้หน้า AND และค่ามากไว้หลัง AND เสมอ
topic.5.example=SELECT title, pages\nFROM books\nWHERE pages BETWEEN 200 AND 300;
topic.5.expected_result=title               | pages\n--------------------+------\nData Modeling Guide | 260\nQuery Patterns      | 210
topic.5.mistakes=- ใส่ตัวเลขสลับฝั่ง เช่น BETWEEN 300 AND 200 (ผลลัพธ์จะว่างเปล่า)\n- เข้าใจผิดว่า BETWEEN ไม่นับค่าขอบ (จริงๆ นับรวมทั้ง 200 และ 300)

topic.6.id=KC06
topic.6.category=การเรียงลำดับและจำกัดจำนวน
topic.6.title=ORDER BY (ASC / DESC) — เรียงลำดับข้อมูล
topic.6.concepts=ORDER BY,ASC,DESC
topic.6.overview=ORDER BY ใช้จัดเรียงแถวผลลัพธ์จากน้อยไปมาก หรือมากไปน้อย ตามคอลัมน์ที่ต้องการ
topic.6.syntax=SELECT column1, column2\nFROM table_name\nORDER BY sort_column DESC;
topic.6.explanation=- ASC เรียงจากน้อยไปมาก (A-Z, เลขน้อยไปมาก) ถ้าไม่เขียนจะถือว่าเป็น ASC อัตโนมัติ\n- DESC เรียงจากมากไปน้อย (Z-A, เลขมากไปน้อย)\n- ตำแหน่งของ ORDER BY ต้องอยู่หลัง WHERE เสมอ
topic.6.example=SELECT title, pages\nFROM books\nORDER BY pages DESC;
topic.6.expected_result=title               | pages\n--------------------+------\nOcean Atlas         | 410\nStarlight Tales     | 320\nData Modeling Guide | 260\nQuery Patterns      | 210\nSQL Basics          | 180
topic.6.mistakes=- เอา ORDER BY ไปวางก่อน WHERE\n- ลืมใส่ DESC ตอนที่ต้องการเรียงจากค่ามากสุดลงมา

topic.7.id=KC07
topic.7.category=การเรียงลำดับและจำกัดจำนวน
topic.7.title=LIMIT — จำกัดจำนวนแถว
topic.7.concepts=LIMIT
topic.7.overview=LIMIT ใช้กำหนดเพดานว่าจะให้แสดงผลลัพธ์สูงสุดกี่แถว มักใช้คู่กับ ORDER BY เพื่อหยิบ Top N อันดับแรก
topic.7.syntax=SELECT column1, column2\nFROM table_name\nORDER BY sort_column DESC\nLIMIT row_count;
topic.7.explanation=- LIMIT จะอยู่ท้ายสุดของคำสั่ง ต่อจาก ORDER BY\n- ควรเรียงลำดับด้วย ORDER BY ก่อนใช้ LIMIT เพื่อให้ได้อันดับที่ต้องการจริงๆ
topic.7.example=SELECT title, pages\nFROM books\nORDER BY pages DESC\nLIMIT 2;
topic.7.expected_result=title           | pages\n----------------+------\nOcean Atlas     | 410\nStarlight Tales | 320
topic.7.mistakes=- วาง LIMIT ไว้ก่อน ORDER BY (ผิดไวยากรณ์ SQL)\n- ใช้ LIMIT เพื่อหาตัวมากสุด/น้อยสุด โดยไม่ได้ใส่ ORDER BY กำกับ

topic.8.id=KC08
topic.8.category=การเชื่อมหลายตาราง
topic.8.title=JOIN & ON — เชื่อมข้อมูลสองตาราง
topic.8.concepts=JOIN,ON
topic.8.overview=JOIN ใช้จับคู่ข้อมูลจาก 2 ตารางที่มีคอลัมน์อ้างอิงตรงกัน มาวางต่อเป็นแถวเดียวกันในคำสั่งเดียว
topic.8.syntax=SELECT table1.col1, table2.col2\nFROM table1\nJOIN table2 ON table1.key_col = table2.key_col;
topic.8.explanation=- FROM ระบุตารางแรก และ JOIN ระบุตารางที่สองที่จะเอามาเชื่อม\n- ON บอกเงื่อนไขจับคู่ระหว่างสองตาราง (มักเป็นรหัส Primary Key = Foreign Key)\n- ถ้าคอลัมน์ชื่อซ้ำกันในทั้ง 2 ตาราง ให้เขียนชื่อตารางนำหน้า เช่น books.author_id
topic.8.example=SELECT books.title, authors.author_name\nFROM books\nJOIN authors ON books.author_id = authors.author_id;
topic.8.expected_result=title               | author_name\n--------------------+------------\nSQL Basics          | Maya Lin\nStarlight Tales     | Kenji Sato\nData Modeling Guide | Maya Lin\nOcean Atlas         | Elena Ruiz\nQuery Patterns      | Kenji Sato
topic.8.mistakes=- ลืมเขียน ON ทำให้ทุกแถวของสองตารางคูณไขว้กันมั่ว\n- เลือกคอลัมน์ที่มีชื่อซ้ำกันทั้งสองตารางโดยไม่ระบุชื่อตารางนำหน้า (ระบบจะฟ้องว่ากำกวม)

topic.9.id=KC09
topic.9.category=การเชื่อมหลายตาราง
topic.9.title=Table Aliases — ตั้งชื่อย่อให้ตาราง
topic.9.concepts=Table Aliases,AS,JOIN
topic.9.overview=Table Alias คือการตั้งชื่อเล่นสั้นๆ ให้ตารางภายในคำสั่ง เพื่อให้เขียน SELECT, JOIN, ON และ WHERE ได้สั้นและอ่านง่ายขึ้น
topic.9.syntax=SELECT t1.col1, t2.col2\nFROM table1 t1\nJOIN table2 t2 ON t1.key_col = table2.key_col;
topic.9.explanation=- เว้นวรรคหลังชื่อตารางแล้วตามด้วยชื่อย่อสั้นๆ เช่น books b และ authors a\n- หลังจากตั้งแล้ว ใช้ b.คอลัมน์ และ a.คอลัมน์ ได้ทั้งใน SELECT, ON, WHERE และ ORDER BY
topic.9.example=SELECT b.title, a.author_name, a.country\nFROM books b\nJOIN authors a ON b.author_id = a.author_id\nWHERE a.country = 'Japan';
topic.9.expected_result=title           | author_name | country\n----------------+-------------+--------\nStarlight Tales | Kenji Sato  | Japan\nQuery Patterns  | Kenji Sato  | Japan
topic.9.mistakes=- ตั้งชื่อย่อให้ตารางแล้ว แต่ยังเผลอเรียกชื่อตารางเต็มในประโยคเดียวกัน\n- ตั้งชื่อย่อซ้ำหรือสับสนเมื่อชื่อตารางขึ้นต้นด้วยตัวอักษรเดียวกัน

topic.10.id=KC10
topic.10.category=ฟังก์ชันคำนวณค่าสรุป
topic.10.title=MAX() — หาค่าสูงสุด
topic.10.concepts=MAX
topic.10.overview=MAX() ใช้หาค่าตัวเลขที่สูงที่สุดเพียงค่าเดียวในคอลัมน์ จากทุกแถวที่ผ่านเงื่อนไข WHERE
topic.10.syntax=SELECT MAX(number_column)\nFROM table_name\nWHERE condition;
topic.10.explanation=- MAX(คอลัมน์) จะคำนวณแล้วคืนค่าสูงสุดออกมา 1 ค่า\n- สามารถใช้ AS ตั้งชื่อหัวคอลัมน์ผลลัพธ์ให้อ่านง่ายได้ เช่น MAX(pages) AS longest_book_pages
topic.10.example=SELECT MAX(pages) AS longest_book_pages\nFROM books;
topic.10.expected_result=longest_book_pages\n------------------\n410
topic.10.mistakes=- เอา MAX() ไปเทียบตรงๆ ใน WHERE เช่น WHERE pages = MAX(pages) ซึ่งทำไม่ได้ ต้องใช้ Subquery แทน\n- คิดว่าเขียน SELECT MAX(pages) ตัวเดียวแล้วจะได้รายละเอียดคอลัมน์อื่นของแถวนั้นติดมาด้วย

topic.11.id=KC11
topic.11.category=คำสั่งซ้อนขั้นสูง
topic.11.title=Subquery — เขียน SELECT ซ้อนในเงื่อนไข
topic.11.concepts=Subquery
topic.11.overview=Subquery คือการนำคำสั่ง SELECT อีกชุดหนึ่งใส่ในวงเล็บ ( ) ไว้ข้างในคำสั่งหลัก เพื่อหาค่ากลางมาก่อน แล้วเอาค่านั้นไปใช้เปรียบเทียบต่อ
topic.11.syntax=SELECT column1, column2\nFROM table_name\nWHERE value_column = (SELECT MAX(value_column) FROM table_name);
topic.11.explanation=- ระบบจะรันคำสั่งในวงเล็บก่อนเพื่อให้ได้ค่าคำตอบออกมา 1 ค่า\n- จากนั้นคำสั่งหลักด้านนอกจะดึงแถวที่ตรงกับค่านั้นออกมาทั้งหมด\n- ถ้าต้องการค่าสูงสุดเฉพาะกลุ่ม ต้องใส่เงื่อนไข WHERE เดียวกันไว้ในวงเล็บด้วย
topic.11.example=SELECT title, pages\nFROM books\nWHERE pages = (SELECT MAX(pages) FROM books);
topic.11.expected_result=title       | pages\n------------+------\nOcean Atlas | 410
topic.11.mistakes=- ลืมใส่วงเล็บ ( ) ครอบคำสั่ง SELECT ตัวใน\n- ลืมใส่เงื่อนไขกรองกลุ่มใน Subquery ทำให้ได้ค่าสูงสุดของทั้งตารางแทนที่จะเป็นของกลุ่มนั้น\n- ให้ Subquery คืนค่ามามากกว่า 1 คอลัมน์ทั้งที่เทียบด้วยเครื่องหมาย =
